<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#E8372C" />
  <title>Sin conexión — Del Sol 99.5 FM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #141519;
      color: #f2f2f2;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #E8372C;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .icon span {
      font-size: 1.5rem;
      font-weight: 700;
      color: white;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    p {
      color: #818694;
      font-size: 0.9rem;
      margin-bottom: 2rem;
      max-width: 280px;
    }
    button {
      background: #E8372C;
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem 2rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #d42e24; }
  </style>
</head>
<body>
  <div class="icon"><span>DS</span></div>
  <h1>Sin conexión</h1>
  <p>No tenés conexión a internet. Los episodios descargados siguen disponibles en la app.</p>
  <button onclick="location.reload()">Reintentar</button>
</body>
</html>
